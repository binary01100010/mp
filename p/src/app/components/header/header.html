<nav class="header">
  <div class="headerLeft">
    <img src="logo/logo.svg" alt="logo of website" />
  </div>
  <div class="headerRight">
    <div class="headerRightA">
      <a href="#AboutMe">{{ 'ABOUT_ME' | translate }}</a>
      <a href="#Skills">{{ 'SKILLS' | translate }}</a>
      <a href="#Portfolio">{{ 'PORTFOLIO' | translate }}</a>
    </div>
    <div class="headerRightLanguage">
      <button
        class="btnDE"
        (click)="language.changeLanguage('de')"
        [class.active]="language.languageDE()"
      >
        {{ 'DE' | translate }}
      </button>
      <button
        class="btnEN"
        (click)="language.changeLanguage('en')"
        [class.active]="language.languageEN()"
      >
        {{ 'EN' | translate }}
      </button>
    </div>
  </div>
  @if (window.widthInnerActive()) {
    <div class="hamburgerMenu">
      <div class="hm"></div>
      <div class="hm"></div>
      <div class="hm"></div>
    </div>
  }
</nav>
